name: Metrics

on:
  # Regenerate every day at 00:00 WITA (16:00 UTC)
  schedule:
    - cron: "0 16 * * *"
  # Allow running manually from the Actions tab
  workflow_dispatch:

# Scope write access to this workflow only (repo default stays read-only)
permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Main card: header, activity, repos, and language breakdown (terminal theme)
      - name: Generate metrics card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ravi-arnan
          template: terminal
          base: header, activity, repositories, metadata
          config_timezone: Asia/Makassar
          config_animations: no
          plugin_languages: yes
          plugin_languages_limit: 8

      # Contribution calendar (full year isometric graph)
      - name: Generate contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: github-metrics-calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ravi-arnan
          base: ""
          config_timezone: Asia/Makassar
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            [fill="#ebedf0"]{fill:#161b22}
            h2,h3{color:#7aa2f7}
            svg{color:#a9b1d6}
            .field svg{fill:#7aa2f7}
